name: Importera sevärdheter (Sverige)

on:
  schedule:
    - cron: '0 3 1 * *'   # kl 03:00 UTC den 1:a varje månad
  workflow_dispatch: {}    # + en knapp för att köra manuellt när du vill i GitHub-fliken "Actions"

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checka ut repot
        uses: actions/checkout@v4

      - name: Sätt upp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installera beroenden
        run: pip install osmium shapely requests --break-system-packages

      - name: Ladda ner Sverige-utdraget från Geofabrik
        run: curl -L -o sweden-latest.osm.pbf https://download.geofabrik.de/europe/sweden-latest.osm.pbf

      - name: Kör importskriptet
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 import_landmarks.py
